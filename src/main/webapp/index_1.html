<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ECOGUARD - Registro de mediciones</title>
</head>

<body>

    <h1>ECOGUARD</h1>
    <h2>Registro de mediciones ambientales</h2>

    <form action="MedicionServlet" method="POST">

        <label for="temperatura">Temperatura:</label>
        <input type="number" step="0.01" id="temperatura" name="temperatura" required>
        <br><br>

        <label for="humedadAire">Humedad del aire:</label>
        <input type="number" step="0.01" id="humedadAire" name="humedadAire" required>
        <br><br>

        <label for="humedadSuelo">Humedad del suelo:</label>
        <input type="number" step="0.01" id="humedadSuelo" name="humedadSuelo" required>
        <br><br>

        <label for="nivelLuz">Nivel de luz:</label>
        <input type="number" step="0.01" id="nivelLuz" name="nivelLuz" required>
        <br><br>

        <button type="submit">Registrar medición</button>

    </form>

</body>
</html>
